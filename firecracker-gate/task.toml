schema_version = "1.3"

# Capture /app for clean-room rescoring in the separate verifier container.
[[artifacts]]
source = "/app/"
exclude = [
    "**/.git/**",
    "**/__pycache__/**",
]

[task]
name = "coreyjacobs/firecracker-gate"
description = "Build a fail-closed gate around a real Firecracker microVM from a spec; graded on real VMs running guest programs the agent never saw."
authors = []
keywords = ["security", "red-team", "sandbox", "firecracker", "microvm", "rogue-agent", "frontierswe"]

[metadata]
difficulty = "hard"
category = "cybersecurity"
oracle_reward_threshold = 0.999

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]

[solution.env]

[environment]
network_mode = "allowlist"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480

[environment.env]
